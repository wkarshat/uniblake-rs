[package]
name = "uniblake-rs"
version = "0.1.0"
# Edition 2021, not 2024, to keep the MSRV low: edition 2024 requires rustc
# 1.85, and nothing here needs it. The library uses no feature newer than
# edition 2021 itself, which is rustc 1.56.
#
# rust-version 1.63 is measured: the library builds there. The practical
# target is what a current LTS ships -- rustc 1.75 -- where the library builds
# and the full test suite passes with the pinned oracle below.
edition = "2021"
rust-version = "1.63"
license = "MIT"
description = "BLAKE2b with specified eager absorption and a shared-prefix fast path"
repository = "https://github.com/wkarshat/uniblake-rs"
categories = ["cryptography", "no-std"]
keywords = ["blake2", "blake2b", "hash"]

# The package is uniblake-rs, to match the repository and to sit beside the C
# uniblake without ambiguity. The library keeps the shorter name so callers
# write `uniblake::Params`, not `uniblake_rs::Params`.
[lib]
name = "uniblake"

# No dependencies. See docs/DESIGN.md A5.
[dependencies]

[dev-dependencies]
# Pinned: 1.0.3+ moved to edition 2024 and constant_time_eq 0.4.2, which
# together require rustc 1.85. Neither is a code requirement -- 1.0.5's source
# builds on 1.69 with the manifest reverted -- so the pin costs nothing but
# keeps `cargo test` working on the toolchain a current LTS ships (1.75).
blake2b_simd = "=1.0.2"   # oracle only

[profile.bench]
lto = true
codegen-units = 1
